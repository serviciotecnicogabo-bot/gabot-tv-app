name: Construir APK GABOT

# Este archivo construye SOLO el .apk de GABOT STREAMING en la nube.
# Trae el proyecto completo dentro (no necesitas subir carpetas).
# Se ejecuta al subirlo y tambien a mano desde la pestana Actions.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Escribir el proyecto en disco
        run: |
          echo "" | base64 -d > proyecto.zip
          mkdir -p proyecto && unzip -o proyecto.zip -d proyecto

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar el APK (debug)
        working-directory: proyecto
        run: gradle assembleDebug --no-daemon

      - name: Renombrar el APK
        run: cp proyecto/app/build/outputs/apk/debug/app-debug.apk gabot-streaming.apk

      - name: Publicar el APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GABOT STREAMING - ultima APK
          files: gabot-streaming.apk
