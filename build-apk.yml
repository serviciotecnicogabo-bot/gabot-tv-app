name: Construir APK GABOT

# Se ejecuta cada vez que subes cambios, o manualmente desde la pestaña Actions.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK (debug)
        run: gradle assembleDebug --no-daemon

      - name: Renombrar el APK
        run: cp app/build/outputs/apk/debug/app-debug.apk gabot-streaming.apk

      - name: Publicar el APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: GABOT STREAMING - ultima APK
          files: gabot-streaming.apk
